version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - '2001:2001'
      - '9229:9229' # Debug port
    environment:
      - NODE_ENV=development
      - PORT=2001
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/dawabuyi_dev
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_TLS=false
      - REDIS_ENABLED=true
      - JWT_ACCESS_SECRET=dev-jwt-access-secret-key-32-chars-min
      - JWT_REFRESH_SECRET=dev-jwt-refresh-secret-key-32-chars-min
      - UPSTASH_REDIS_REST_URL=http://redis:6379
      - UPSTASH_REDIS_REST_TOKEN=dummy-token
      - LOG_LEVEL=debug
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    volumes:
      - .:/app
      - /app/node_modules
      - ./logs:/app/logs
    command: sh -c "npm run prisma:generate && npx tsx watch src/server.ts"

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=dawabuyi_dev
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - '5432:5432'
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_dev_data:/data
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Browser DB UI (use this instead of host Prisma Studio on Windows)
  adminer:
    image: adminer:4
    ports:
      - '5050:8080'
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

volumes:
  postgres_dev_data:
  redis_dev_data:

networks:
  app-network:
    driver: bridge
